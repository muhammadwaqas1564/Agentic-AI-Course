<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResearchFlow · AI Academic Discovery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #05070c;
      --bg-elevated: #0c0f17;
      --bg-card: #11141f;
      --border-subtle: #1a1f2e;
      --border-active: #2d374b;
      --accent-primary: #3b82f6;
      --accent-glow: #3b82f660;
      --accent-secondary: #06b6d4;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #5b6b8c;
      --success: #10b981;
      --gradient-brand: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      --shadow-sm: 0 8px 20px rgba(0,0,0,0.3);
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ambient orbs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, rgba(6,182,212,0) 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(59,130,246,0) 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    .hero {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59,130,246,0.08);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(59,130,246,0.2);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--accent-secondary);
      margin-bottom: 2rem;
    }

    .badge span {
      font-size: 1rem;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .gradient-text {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 560px;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .search-container {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 80px;
      padding: 6px;
      display: flex;
      gap: 8px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .search-container:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-container input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .search-container input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-btn {
      background: var(--gradient-brand);
      border: none;
      border-radius: 60px;
      padding: 10px 28px;
      font-weight: 600;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2px;
    }

    .search-btn:hover {
      opacity: 0.9;
      transform: scale(0.98);
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 2rem;
    }

    .chip {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .chip:hover {
      background: rgba(59,130,246,0.1);
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }

    .features {
      display: flex;
      gap: 24px;
      margin-top: 3.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .feature-pill .dot {
      width: 6px;
      height: 6px;
      background: var(--accent-secondary);
      border-radius: 50%;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      animation: fadeUp 0.6s ease forwards;
    }

    @media (max-width: 640px) {
      .search-container {
        flex-direction: column;
        border-radius: 24px;
        background: var(--bg-card);
      }
      .search-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">
      <span>✨</span> INTELLIGENT RESEARCH
    </div>
    <h1>Uncover <span class="gradient-text">breakthroughs</span><br>with AI precision</h1>
    <p class="subtitle">
      Real academic papers. Instant summaries. Key insights in seconds.
    </p>

    <form action="/search" method="POST" style="width: 100%;">
      <div class="search-container">
        <input
          type="text"
          name="topic"
          id="topicInput"
          placeholder="e.g. Multimodal LLMs, RNA therapeutics, dark matter detection…"
          autocomplete="off"
          required
        />
        <button type="submit" class="search-btn">Analyze →</button>
      </div>
    </form>

    <div class="suggestions">
      <span class="chip" onclick="fill('Large Language Models')">LLM alignment</span>
      <span class="chip" onclick="fill('CRISPR gene therapy')">CRISPR gene therapy</span>
      <span class="chip" onclick="fill('graph neural networks')">Graph neural nets</span>
      <span class="chip" onclick="fill('quantum error correction')">Quantum error correction</span>
      <span class="chip" onclick="fill('sustainable aviation fuel')">Sustainable aviation</span>
    </div>

    <div class="features">
      <div class="feature-pill"><div class="dot"></div> Semantic Scholar + arXiv</div>
      <div class="feature-pill"><div class="dot"></div> GPT‑powered synthesis</div>
      <div class="feature-pill"><div class="dot"></div> Actionable takeaways</div>
    </div>
  </div>

  <script>
    function fill(text) {
      document.getElementById('topicInput').value = text;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
<div class="app-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand"><i class="bi bi-stars"></i> NeuralChat</span>
      <button class="btn-icon" id="closeSidebar" title="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <i class="bi bi-plus-lg"></i> New Chat
    </button>

    <div class="model-select-wrap">
      <label class="model-label">Model</label>
      <select class="model-select" id="modelSelect">
        {% for m in models %}
        <option value="{{ m }}">{{ m }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="sessions-label">Recent Chats</div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <!-- Main -->
  <main class="main-area">
    <header class="topbar">
      <button class="btn-icon" id="toggleSidebar"><i class="bi bi-layout-sidebar"></i></button>
      <span class="topbar-title" id="topbarModel">meta-llama</span>
      <div></div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="empty-state" id="emptyState">
        <i class="bi bi-stars empty-icon"></i>
        <p>Start a conversation</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="Message..."></textarea>
        <button id="sendBtn"><i class="bi bi-arrow-up-circle-fill"></i></button>
      </div>
      <p class="disclaimer">AI can make mistakes. Verify important info.</p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
